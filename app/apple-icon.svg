<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="#0A0A0F"/>
  
  <!-- Gradient border effect -->
  <rect x="5" y="5" width="170" height="170" rx="35" stroke="url(#gradient)" stroke-width="8"/>
  
  <!-- MF Text -->
  <text x="90" y="115" font-family="Arial, sans-serif" font-size="70" font-weight="bold" fill="#00F0FF" text-anchor="middle">MF</text>
  
  <!-- Small subtitle -->
  <text x="90" y="145" font-family="Arial, sans-serif" font-size="16" fill="#8B5CF6" text-anchor="middle">Full Stack Dev</text>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
</svg>
